<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · red fonts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: "Inter Tight", sans-serif; padding: 40px; }
  h1 { font-size: 13px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: #999; margin-bottom: 24px; }
  .row { display: flex; gap: 28px; flex-wrap: wrap; }
  figure { display: flex; flex-direction: column; gap: 12px; }
  figcaption { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  figcaption small { display: block; color: #888; letter-spacing: 0; text-transform: none; margin-top: 2px; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 36px; background: #222; }
</style>
</head>
<body>
<h1>Red direction · same font for the greeting and the titles</h1>
<div class="row">
  <figure><figcaption>League Gothic<small>Tallest and thinnest, closest to the reference</small></figcaption><iframe src="home-design.html?dir=red&font=league&shot=1"></iframe></figure>
  <figure><figcaption>Bebas Neue<small>Rounder, softer, a bit wider</small></figcaption><iframe src="home-design.html?dir=red&font=bebas&shot=1"></iframe></figure>
  <figure><figcaption>Anton<small>The red from the earlier version, heaviest</small></figcaption><iframe src="home-design.html?dir=red&font=anton&shot=1"></iframe></figure>
  <figure><figcaption>Oswald<small>Lighter, more like a magazine headline</small></figcaption><iframe src="home-design.html?dir=red&font=oswald&shot=1"></iframe></figure>
</div>
</body>
</html>
