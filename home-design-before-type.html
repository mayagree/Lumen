<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Anton&family=Archivo:wdth,wght@62..125,300..800&family=JetBrains+Mono:wght@400;500&family=Bebas+Neue&family=League+Gothic&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ffffff;
    --soft: rgba(255,255,255,.78);
    --accent: #eef35a;
    --accent-ink: #12140a;
    --display: "Archivo", sans-serif;
    --display-size: 34px;
    --display-track: -.02em;
    --display-stretch: 125%;
    --display-weight: 700;
    --badge-size: 30px;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: #111; }
  body { font-family: "Inter Tight", system-ui, sans-serif; color: var(--ink); display: flex; gap: 40px; align-items: center; justify-content: center; padding: 30px; flex-wrap: wrap; }
  button, a { font: inherit; color: inherit; background: none; border: 0; text-decoration: none; cursor: pointer; }

  /* Controls outside the phone, only to compare accents and fonts. */
  .controls { color: #ddd; font-size: 13px; display: grid; gap: 14px; width: 200px; }
  .controls p { color: #888; }
  .controls .sw { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .controls button { padding: 6px 10px; border-radius: 99px; border: 1px solid #444; color: #ddd; }
  .controls button.on { background: #eee; color: #111; }
  .controls .pick { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: #999; font-size: 12px; }
  .controls input[type=color] { width: 28px; height: 28px; border: 1px solid #444; border-radius: 50%; background: none; padding: 0; cursor: pointer; }
  .controls input[type=range] { width: 100%; margin-top: 8px; accent-color: #eee; }

  .phone { width: 390px; height: 844px; border-radius: 46px; overflow: hidden; position: relative; background: #6e7378; flex: 0 0 auto; }
  @media (max-width: 700px) { body { display: block; padding: 0; } .controls { display: none; } .phone { width: 100vw; height: 100dvh; border-radius: 0; } }

  /* A grey, frosted world: the poster in the middle gives a muted wash, then a grey veil and grain. */
  .wash { position: absolute; inset: -30%; background-size: cover; background-position: center; filter: blur(80px) saturate(.55) brightness(.95); transition: opacity .9s ease; }
  .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(110,115,120,.35), rgba(96,101,107,.45) 50%, rgba(78,83,89,.6)); }
  .grain { position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay; pointer-events: none;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }

  .scroll { position: absolute; inset: 0; overflow-y: auto; padding-bottom: 120px; scrollbar-width: none; transition: opacity .35s ease; }
  .scroll::-webkit-scrollbar { display: none; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 58px 22px 0; }
  .logo { font-size: 13px; letter-spacing: .32em; font-weight: 500; }
  .top-right { display: flex; align-items: center; gap: 18px; font-size: 14px; }
  .top-right svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; }

  /* Greeting off the left edge: "Idan" steps in, on its own line. */
  .hello { padding: 38px 22px 0; display: grid; grid-template-columns: repeat(6, 1fr); font-family: var(--display); font-stretch: var(--display-stretch); font-weight: var(--display-weight); text-transform: uppercase; letter-spacing: var(--display-track); line-height: .92; }
  .hello .w { font-size: calc(var(--display-size) * 1.18); }
  .hello .w1 { grid-column: 1 / 7; }
  .hello .w2 { grid-column: 2 / 7; }
  .hello .w3 { grid-column: 1 / 4; color: var(--accent); }
  .hello .note { grid-column: 3 / 7; margin-top: 16px; font-family: var(--mono); font-stretch: 100%; font-weight: 400; font-size: 10px; line-height: 1.45; letter-spacing: .04em; color: var(--soft); padding-bottom: 4px; }
  .hello .note b { color: var(--ink); font-weight: 500; }

  .stack .hello { display: block; padding-top: 30px; line-height: .9; }
  .stack .hello .w { display: block; font-size: calc(var(--display-size) * var(--hello-scale, 2)); }
  .stack .hello .note { display: block; margin-top: 18px; max-width: 220px; }
  .hello .note .arr { width: 30px; height: 10px; vertical-align: 0; margin-right: 6px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sans .filters, .sans .rail-title, .sans .body .meta, .sans .body .scores, .sans .badge small, .sans .hello .note { font-family: "Inter Tight", sans-serif; font-stretch: 100%; font-weight: 500; letter-spacing: .08em; }
  .sans .hello .note { font-size: 11px; line-height: 1.5; }
  .filters { display: flex; gap: 6px; padding: 30px 22px 0; overflow-x: auto; scrollbar-width: none; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .filters::-webkit-scrollbar { display: none; }
  .filters button { color: var(--soft); white-space: nowrap; padding: 8px 14px; border-radius: 99px; }
  /* The chosen category: a frosted pill tinted with the accent. */
  .filters button.on { color: var(--accent-ink); background: color-mix(in srgb, var(--accent) 80%, transparent);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 24px color-mix(in srgb, var(--accent) 35%, transparent); }

  .rail { display: flex; gap: 16px; overflow-x: auto; padding: 26px 22px 10px; scroll-snap-type: x mandatory; scroll-padding-inline: 22px; scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail-title.first { padding-top: 34px; margin-bottom: -10px; }
  .rail-title { padding: 30px 22px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }

  /* A card is one object: the sharp poster melts into its own blurred, greyed copy, which holds the title. No cut edge. */
  .card { flex: 0 0 80%; scroll-snap-align: start; position: relative; isolation: isolate; text-align: left; display: block; }
  .body { position: relative; border-radius: 26px; overflow: hidden; height: 500px; }
  .body .smear { position: absolute; inset: -10%; background-size: 100% 140%; background-position: center bottom; filter: blur(26px) saturate(.6) brightness(.85); }
  .body .tint { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(70,75,80,.45)); }
  .body .img { position: absolute; left: 0; right: 0; top: 0; height: 410px; background-size: cover; background-position: center;
    -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 100%); mask-image: linear-gradient(180deg, #000 62%, transparent 100%); }
  .body .band { position: absolute; left: 0; right: 0; top: 250px; height: 200px; }
  .body .band i { position: absolute; inset: 0; }
  .body .band i:nth-child(1) { backdrop-filter: blur(3px); -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent); mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent); }
  .body .band i:nth-child(2) { backdrop-filter: blur(10px); -webkit-mask-image: linear-gradient(180deg, transparent 35%, #000 70%); mask-image: linear-gradient(180deg, transparent 35%, #000 70%); }
  .body .info { position: absolute; left: 18px; right: 18px; bottom: 18px; }
  .body h3 { font-family: var(--display); font-stretch: var(--display-stretch); font-size: var(--display-size); line-height: .95; letter-spacing: var(--display-track); text-transform: uppercase; color: var(--accent); font-weight: var(--display-weight); }
  .body .meta { margin-top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--soft); }
  .body .scores { display: flex; gap: 14px; margin-top: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .04em; }
  .body .scores b { font-weight: 500; }
  .body .scores span { color: var(--soft); }
  .marks { position: absolute; top: 16px; right: 16px; z-index: 2; display: flex; gap: 10px; }
  .mark { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; filter: drop-shadow(0 1px 4px rgba(0,0,0,.4)); }
  .mark.heart { fill: #fff; }
  .badge { position: absolute; top: 14px; left: 16px; z-index: 2; text-shadow: 0 1px 8px rgba(0,0,0,.35); line-height: 1; }
  .badge b { display: block; font-family: var(--display); font-stretch: var(--display-stretch); font-size: var(--badge-size); font-weight: var(--display-weight); letter-spacing: var(--display-track); }
  .badge small { display: block; margin-top: 4px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  /* Recommended: an accent glow around the whole card, the same "we suggest this" language as the film page. */
  .card.rec::before { content: ""; position: absolute; inset: -18px -14px; z-index: -1; border-radius: 40px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 55%, transparent), transparent); filter: blur(18px); }
  .card.rec .badge small { color: var(--accent); }

  .tabbar { position: absolute; left: 16px; right: 16px; bottom: 22px; height: 62px; border-radius: 31px; display: flex; justify-content: space-around; align-items: center; z-index: 4;
    background: rgba(255,255,255,.16); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); transition: opacity .3s ease; }
  .tabbar span { display: grid; justify-items: center; gap: 3px; font-size: 10px; color: var(--soft); }
  .tabbar span.on { color: var(--ink); }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .dark { position: absolute; inset: 0; background: #123049; opacity: 0; pointer-events: none; transition: opacity .55s ease; z-index: 5; }
  .fly { position: absolute; z-index: 6; background-size: cover; pointer-events: none;
    transition: left .6s cubic-bezier(.2,.8,.2,1), top .6s cubic-bezier(.2,.8,.2,1), width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1), border-radius .6s ease, background-position .6s ease; }
  .film { position: absolute; inset: 0; border: 0; width: 100%; height: 100%; z-index: 7; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
  .film.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="controls">
  <p>Compare (outside the app)</p>
  <div>Presets<div class="sw" id="dirs"></div></div>
  <div>Accent<div class="sw" id="accents"></div><label class="pick">Any colour <input type="color" id="anyColor" value="#ff3b2f"></label></div>
  <div>Title font<div class="sw" id="fonts"></div></div>
  <div>Greeting<div class="sw" id="layouts"></div></div>
  <div>Greeting size<input type="range" id="helloSize" min="1.2" max="2.6" step="0.05" value="2"></div>
  <div>Small text<div class="sw" id="smalls"></div></div>
</div>

<div class="phone" id="phone">
  <div class="wash" id="washA"></div><div class="wash" id="washB" style="opacity:0"></div>
  <div class="veil"></div><div class="grain"></div>

  <div class="scroll" id="scroll">
    <div class="top">
      <span class="logo">LUMEN</span>
      <div class="top-right"><span>Lumen Ayalon ▾</span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg></div>
    </div>
    <div class="hello"><span class="w w1">Good</span><span class="w w2">evening,</span><span class="w w3">Idan</span><span class="note"><svg class="arr" viewBox="0 0 30 10" aria-hidden="true"><path d="M1 5h27M24 1.5 28 5l-4 3.5"/></svg><b>3 FILMS</b><br>FROM YOUR LIST ARE<br>SHOWING THIS WEEK.</span></div>
    <div class="filters" id="filters"></div>
    <p class="rail-title first" id="railTitle">Picked for you</p>
    <div class="rail" id="rail"></div>
    <p class="rail-title">Coming soon</p>
    <div class="rail" id="soon"></div>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
  <div class="dark" id="darkLayer"></div>
  <iframe class="film" id="film" title="Film page"></iframe>
</div>

<script>
  const FILMS = [
    { k: 'odyssey2', t: 'The Odyssey', m: 'Adventure · 2h 50m · IMAX', match: 94, s: [['IMDb', '8.4'], ['RT', '91%'], ['LB', '4.2']], rec: true, saved: true },
    { k: 'whalefall', t: 'Whalefall', m: 'Thriller · 1h 52m', match: 86, s: [['IMDb', '7.4'], ['RT', '88%'], ['LB', '3.7']], saved: true },
    { k: 'verity', t: 'Verity', m: 'Drama · 1h 58m', match: 79, s: [['IMDb', '7.0'], ['RT', '81%'], ['LB', '3.4']], loved: true },
    { k: 'clayface', t: 'Clayface', m: 'Horror · 1h 49m', match: 74, s: [['IMDb', '7.1'], ['RT', '78%'], ['LB', '3.3']], saved: true },
    { k: 'wild-horse-nine', t: 'Wild Horse Nine', m: 'Comedy · 1h 46m', match: 72, s: [['IMDb', '6.9'], ['RT', '84%'], ['LB', '3.5']] },
    { k: 'digger', t: 'Digger', m: 'Comedy · 1h 39m', match: 61, s: [['IMDb', '6.6'], ['RT', '77%'], ['LB', '3.2']] },
  ];
  const SOON = [
    { k: 'wicker', t: 'Wicker', m: 'In cinemas Dec 4', s: [], saved: true },
    { k: 'street-fighter', t: 'Street Fighter', m: 'In cinemas Dec 11', s: [] },
    { k: 'rolling-loud', t: 'Rolling Loud', m: 'In cinemas Dec 18', s: [] },
  ];
  const img = k => `url('posters/${k}.webp')`;
  var pick;
  const LIST = '<svg class="mark" viewBox="0 0 24 24" aria-label="In your list"><path d="M4 6h11M4 12h11M4 18h7M14.5 18l2.5 2.5 4.5-5"/></svg>';
  const HEART = '<svg class="mark heart" viewBox="0 0 24 24" aria-label="You loved this"><path d="M12 20s-7-4.3-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.7-7 10-7 10z"/></svg>';
  const ICON = {
    films: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4M16 5v4"/></svg>',
    night: '<svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H6a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/></svg>',
    snacks: '<svg viewBox="0 0 24 24"><path d="M6 9l1.5 11h9L18 9z"/><path d="M6 9c0-2 1.5-3 3-3 .5-1.5 1.7-2 3-2s2.5.5 3 2c1.5 0 3 1 3 3"/></svg>',
    me: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  };
  const card = (f, i) => `
    <button class="card ${f.rec ? 'rec' : ''}" data-i="${i}" data-k="${f.k}">
      <div class="body">
        <div class="smear" style="background-image:${img(f.k)}"></div><div class="tint"></div>
        <div class="img" style="background-image:${img(f.k)}"></div>
        <div class="band"><i></i><i></i></div>
        ${f.match ? `<span class="badge"><b>${f.match}%</b><small>${f.rec ? 'match · for you' : 'match'}</small></span>` : ''}<span class="marks">${f.saved ? LIST : ''}${f.loved ? HEART : ''}</span>
        <div class="info"><h3>${f.t}</h3><p class="meta">${f.m}</p>
          ${f.s.length ? `<div class="scores">${f.s.map(([n, v]) => `<span><b>${v}</b> ${n}</span>`).join('')}</div>` : ''}</div>
      </div>
    </button>`;
  document.getElementById('rail').innerHTML = FILMS.map(card).join('');
  document.getElementById('soon').innerHTML = SOON.map((f, i) => card(f, 100 + i)).join('');
  document.getElementById('filters').innerHTML = ['All', 'Action', 'Date night', 'After dark', 'Family', 'Laughs', 'IMAX']
    .map((f, i) => `<button class="${i ? '' : 'on'}">${f}</button>`).join('');
  document.getElementById('filters').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('railTitle').textContent = b.textContent === 'All' ? 'Picked for you' : `${b.textContent} · picked for you`;
  });
  document.getElementById('tabbar').innerHTML = [['films', 'Films'], ['night', 'My night'], ['snacks', 'Snacks'], ['me', 'Me']]
    .map(([k, n]) => `<span class="${k === 'films' ? 'on' : ''}">${ICON[k]}${n}</span>`).join('');

  // Comparison controls.
  const ACCENTS = [['Yellow', '#eef35a', '#12140a'], ['Royal blue', '#2f4bff', '#fff'], ['Red', '#ff3b2f', '#fff']];
  // name, family, title size, tracking, stretch, weight, match-number size
  const FONTS = [['Archivo wide', '"Archivo", sans-serif', '34px', '-.02em', '125%', 700, '30px'], ['Anton', '"Anton", sans-serif', '44px', '.01em', '100%', 400, '38px'],
    ['Bebas Neue', '"Bebas Neue", sans-serif', '50px', '.01em', '100%', 400, '42px'], ['League Gothic', '"League Gothic", sans-serif', '56px', '.01em', '100%', 400, '44px'], ['Oswald', '"Oswald", sans-serif', '42px', '-.01em', '100%', 500, '36px']];
  const LAYOUTS = [['Grid', ''], ['Stacked left', 'stack']];
  const SMALLS = [['Mono', ''], ['Sans caps', 'sans']];
  // name, accent, font, greeting, small text
  const DIRS = [['Yellow · wide', 'yellow', 'archivo', 'grid', 'mono'], ['Red · condensed', 'red', 'league', 'stacked', 'sans']];
  const root = document.documentElement.style;
  const sw = (id, list, apply) => {
    const el = document.getElementById(id);
    el.innerHTML = list.map((x, i) => `<button class="${i ? '' : 'on'}" data-i="${i}">${x[0]}</button>`).join('');
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); apply(list[b.dataset.i]); });
  };
  sw('accents', ACCENTS, ([, c, ink]) => { root.setProperty('--accent', c); root.setProperty('--accent-ink', ink); });
  sw('fonts', FONTS, ([, f, size, track, st, wt, badge]) => { root.setProperty('--display', f); root.setProperty('--display-size', size); root.setProperty('--display-track', track); root.setProperty('--display-stretch', st); root.setProperty('--display-weight', wt); root.setProperty('--badge-size', badge); });
  const cls = document.documentElement.classList;
  sw('layouts', LAYOUTS, ([, c]) => cls.toggle('stack', c === 'stack'));
  sw('smalls', SMALLS, ([, c]) => cls.toggle('sans', c === 'sans'));
  document.getElementById('anyColor').addEventListener('input', e => {
    const c = e.target.value, n = parseInt(c.slice(1), 16), lum = .299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255);
    root.setProperty('--accent', c); root.setProperty('--accent-ink', lum > 150 ? '#12140a' : '#fff');
    document.querySelectorAll('#accents button').forEach(x => x.classList.remove('on'));
  });
  document.getElementById('helloSize').addEventListener('input', e => root.setProperty('--hello-scale', e.target.value));

  sw('dirs', DIRS, ([, accent, font, layout, small]) => {
    pick('accents', accent); pick('fonts', font); pick('layouts', layout); pick('smalls', small);
  });
  const q = new URLSearchParams(location.search);
  var pick = (id, name) => { const b = [...document.querySelectorAll(`#${id} button`)].find(x => x.textContent.toLowerCase().startsWith(name)); if (b) b.click(); };
  if (q.get('dir')) pick('dirs', q.get('dir'));
  if (q.get('accent')) pick('accents', q.get('accent'));
  if (q.get('font')) pick('fonts', q.get('font'));
  if (q.get('layout')) pick('layouts', q.get('layout'));
  if (q.get('small')) pick('smalls', q.get('small'));
  if (q.get('scale')) { document.getElementById('helloSize').value = q.get('scale'); root.setProperty('--hello-scale', q.get('scale')); }
  if (q.get('shot')) { document.querySelector('.controls').style.display = 'none'; Object.assign(document.body.style, { display: 'block', padding: '0' }); const ph = document.getElementById('phone'); ph.style.cssText = 'width:390px;height:100vh;border-radius:0'; }

  // The wash follows the poster in the middle of the main rail.
  let current = -1, front = 'A';
  function setWash(i) {
    if (i === current) return; current = i;
    const next = front === 'A' ? 'B' : 'A';
    const a = document.getElementById('wash' + front), b = document.getElementById('wash' + next);
    b.style.backgroundImage = img(FILMS[i].k); b.style.opacity = 1; a.style.opacity = 0; front = next;
  }
  const rail = document.getElementById('rail');
  rail.addEventListener('scroll', () => {
    const step = rail.querySelector('.card').offsetWidth + 16;
    setWash(Math.max(0, Math.min(FILMS.length - 1, Math.round(rail.scrollLeft / step))));
  });
  setWash(0);

  // Tap The Odyssey: the poster grows into the film page.
  const phone = document.getElementById('phone'), film = document.getElementById('film');
  film.src = 'film-design.html?poster=odyssey2&pos=center%2062%25';
  rail.addEventListener('click', e => {
    const c = e.target.closest('.card');
    if (!c || c.dataset.k !== 'odyssey2') return;
    const art = c.querySelector('.img'), r = art.getBoundingClientRect(), p = phone.getBoundingClientRect();
    const fly = document.createElement('div');
    fly.className = 'fly';
    Object.assign(fly.style, { backgroundImage: img('odyssey2'), backgroundPosition: 'center', left: r.left - p.left + 'px', top: r.top - p.top + 'px', width: r.width + 'px', height: r.height + 'px', borderRadius: '26px' });
    phone.appendChild(fly);
    document.getElementById('scroll').style.opacity = 0;
    document.getElementById('tabbar').style.opacity = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      Object.assign(fly.style, { left: '0px', top: '0px', width: p.width + 'px', height: '560px', borderRadius: '0px', backgroundPosition: 'center 62%' });
      document.getElementById('darkLayer').style.opacity = 1;
    }));
    setTimeout(() => film.classList.add('show'), 560);
    setTimeout(() => fly.remove(), 900);
  });
  window.addEventListener('message', e => {
    if (e.data !== 'lumen:back') return;
    film.classList.remove('show');
    document.getElementById('darkLayer').style.opacity = 0;
    document.getElementById('scroll').style.opacity = 1;
    document.getElementById('tabbar').style.opacity = 1;
  });
</script>
</body>
</html>
