<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen · מסכים מייצגים</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #6b6b6b; color: #fff; font-family: "IBM Plex Sans Hebrew", sans-serif; padding: 60px; }
  h1 { font-size: 44px; }
  .sub { color: #e6e6e6; font-size: 20px; margin-top: 6px; }
  .arrow { margin: 28px 0 32px; height: 2px; background: #fff; position: relative; direction: ltr; }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -6px; border: 7px solid transparent; border-left: 12px solid #fff; border-right: 0; }
  .row { display: flex; gap: 48px; direction: ltr; flex-wrap: wrap; }
  .screen { display: grid; gap: 14px; width: 390px; direction: rtl; }
  iframe { width: 390px; height: 844px; border: 0; border-radius: 36px; background: #121212; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .screen b { font-size: 22px; }
  .screen p { color: #e6e6e6; font-size: 16px; }
</style>
</head>
<body>
  <h1>מסכים מייצגים</h1>
  <p class="sub">ששה מסכים שעוברים על כל הערב, מהבחירה ועד ההפסקה. כל מסך הוא הפרוטוטייפ עצמו, ואפשר ללחוץ בו.</p>
  <div class="arrow"></div>
  <div class="row" id="row"></div>
<script>
  const screens = [
    ['home', '1 · בית', 'כניסה: התאמה אישית, ציונים וסרט מומלץ'],
    ['film', '2 · דף סרט', 'השעה המוצעת כבר מסומנת, וימים תפוסים ביומן'],
    ['seats', '3 · מושבים', 'מושבים שכבר בחורים ומשולש שדה ראייה'],
    ['snacks', '4 · מזנון בהזמנה', 'גודל לפי אורך הסרט וכמות אנשים, ריפיל להפסקה'],
    ['night-before', '5 · הערב שלי, 3 שעות לפני', 'מתי לצאת, איפה לחנות, זמן פרסומות'],
    ['night-during2', '6 · הערב שלי, בזמן הסרט', 'רגע ההפסקה, והזמנה שמחכה בהפסקה'],
  ];
  document.getElementById('row').innerHTML = screens.map(([d, t, s]) =>
    `<div class="screen"><iframe src="index.html?demo=${d}" title="${t}"></iframe><b>${t}</b><p>${s}</p></div>`).join('');
</script>
</body>
</html>
